# Perfil «local»: para probar en tu computadora sin instalar MySQL ni Docker.
# Los datos se guardan en la carpeta backend/datos/ (se crea sola) con una base de datos compatible con MySQL.
spring.datasource.url=jdbc:h2:file:./datos/destinos;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
