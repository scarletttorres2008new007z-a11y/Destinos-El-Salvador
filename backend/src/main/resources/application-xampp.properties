# Perfil «xampp»: usa el MySQL (MariaDB) de XAMPP, para ver los datos en phpMyAdmin.
# XAMPP trae el usuario root sin contraseña. La base «destinos» se crea sola la primera vez.
spring.datasource.url=jdbc:mysql://localhost:3306/destinos?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=America/El_Salvador
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_CLAVE:}
# Tildes y ñ aunque XAMPP cree la base con otro juego de caracteres
spring.flyway.init-sqls=ALTER DATABASE destinos CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci
