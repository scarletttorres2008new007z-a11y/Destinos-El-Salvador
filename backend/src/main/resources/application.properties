# Destinos El Salvador - configuración del backend.
# Las claves reales (MySQL en producción, Gmail) se pasan por variables de entorno, nunca en este archivo.

server.port=${PUERTO:8080}

# MySQL (en local lo levanta docker-compose.yml de la raíz del repositorio)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/destinos?useUnicode=true&characterEncoding=utf8&serverTimezone=America/El_Salvador}
spring.datasource.username=${DB_USUARIO:destinos}
spring.datasource.password=${DB_CLAVE:destinos}

# Flyway crea y actualiza las tablas; Hibernate solo comprueba que coincidan
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Fotos de Galería: 5 MB por foto, 12 fotos por envío
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=62MB

# Correo de avisos con Gmail (usa una contraseña de aplicación de Google)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USUARIO:}
spring.mail.password=${GMAIL_CLAVE_APP:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Propias del sitio
# Carpeta con las páginas HTML (la raíz del repositorio cuando se arranca desde backend/)
app.sitio.carpeta=${SITIO_CARPETA:..}
# Carpeta donde se guardan las fotos que suben los visitantes
app.uploads.carpeta=${UPLOADS_CARPETA:uploads}
# Correo de la agencia que recibe los avisos
app.correo.agencia=${CORREO_AGENCIA:info@svelsalvador.com}
# Otros orígenes que pueden llamar a la API (por ejemplo Live Server de VS Code)
app.cors.origenes=${CORS_ORIGENES:http://localhost:5500,http://127.0.0.1:5500}
# Envíos permitidos por minuto desde una misma dirección, por formulario
app.limite.por-minuto=5
